<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{metaDescription}}">
  <meta name="theme-color" content="#fcfbf8">
  <title>{{documentTitle}}</title>
  <link rel="stylesheet" href="{{cssUrl}}">
</head>
<body>
  <!-- Editable content: {{sourceNote}}. See EDITING.md in the repository. -->
  <a class="skip" href="#main">{{skipToContent}}</a>
  <header class="container">
    <div class="brand-row">
      <a class="brand" href="{{homeUrl}}"><span class="wordmark">{{brand}}</span></a>
      <span class="term">{{term}}</span>
    </div>
  </header>
  <nav aria-label="{{mainNavigation}}"><div class="container nav-inner">{{navigation}}</div></nav>
  <main id="main" class="container">{{body}}</main>
  <footer class="footer"><div class="container footer-inner"><p>{{footerLeft}}</p><p>{{footerRight}}</p></div></footer>
</body>
</html>
