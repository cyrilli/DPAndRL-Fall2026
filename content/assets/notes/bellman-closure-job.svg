<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 714" width="960" height="714" role="img" aria-labelledby="title desc">
<title id="title">Identical job features prevent a valid candidate from having a representable Bellman backup</title><desc id="desc">For a separate closure test, choose allowed stage-2 weights zero, zero, ten. The worked LSVI fit used zero, three, ten. Maximizing the chosen candidate’s action scores gives next-stage values zero, zero, ten. At stage one, the exact work targets are minus one at progress zero and seven at progress one. Both input pairs have feature zero, one, zero, so a single current coefficient would need to equal both incompatible targets. One allowed candidate therefore disproves Bellman completeness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker></defs>
<rect width="960" height="714" fill="#fcfbf8"/>
<text x="36" y="40" font-size="27" fill="#363432" text-anchor="start" font-family="Georgia, serif">One valid candidate can expose a closure failure</text><text x="36" y="76" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">Test a candidate different from the fitted stage-2 weights (0, 3, 10).</text><rect x="36" y="108" width="360" height="103" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="216" y="141" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Candidate weights for this test</text><text x="216" y="180" font-size="26" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">w₂ = (0, 0, 10)ᵀ</text><path d="M408 160 H459" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><text x="433" y="142" font-size="16" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">max</text><rect x="471" y="108" width="453" height="103" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="697.5" y="141" font-size="19" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Resulting values at progress 0, 1, 2</text><text x="697.5" y="180" font-size="26" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">V̂₂ = (0, 0, 10)ᵀ</text><path d="M697 222 V246 H246 V271" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M697 246 H714 V271" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="282" width="420" height="153" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="246" y="316" font-size="24" fill="#363432" text-anchor="middle" font-family="Georgia, serif">(0, work)</text><text x="246" y="353" font-size="23" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">−1 + 0.8(0) + 0.2(0) = −1</text><text x="246" y="399" font-size="22" fill="#746d66" text-anchor="middle" font-family="Georgia, serif">feature: (0, 1, 0)ᵀ</text><rect x="504" y="282" width="420" height="153" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="714" y="316" font-size="24" fill="#363432" text-anchor="middle" font-family="Georgia, serif">(1, work)</text><text x="714" y="353" font-size="23" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">−1 + 0.8(10) + 0.2(0) = 7</text><text x="714" y="399" font-size="22" fill="#746d66" text-anchor="middle" font-family="Georgia, serif">feature: (0, 1, 0)ᵀ</text><path d="M246 447 V471 H480 V493" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M714 447 V471 H480" fill="none" stroke="#75566f" stroke-width="2"/><rect x="150" y="505" width="660" height="102" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="480" y="540" font-size="21" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Identical features force one shared current score</text><text x="480" y="580" font-size="25" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">u<tspan baseline-shift="sub" font-size="17">1,2</tspan> would have to equal both −1 and 7.</text><text x="36" y="650" font-size="20" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">This candidate is allowed, yet its Bellman backup cannot be represented.</text><text x="36" y="685" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">Thus the requirement “for every next-stage weight vector” fails.</text>
</svg>
