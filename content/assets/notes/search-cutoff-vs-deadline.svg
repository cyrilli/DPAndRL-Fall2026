<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img" aria-labelledby="title desc"><title id="title">A search cutoff is earlier than the real deadline</title><desc id="desc">The job has two decisions and a terminal payoff at stage three. A depth-one search from stage one stops at stage two, leaving one decision and the terminal payoff unsearched. A zero stage-two cutoff function gives work score minus one and wait score zero, choosing wait. The exact stage-two values 0,7,10 give work score4.6 and wait0, choosing work. A cutoff value is an estimate of remaining return, not an additional reward.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#746d66"/></marker></defs><rect width="960" height="710" fill="#fcfbf8"/><g font-family="Arial, sans-serif" fill="#363432"><text x="36" y="40" font-size="28" fill="#363432" text-anchor="start" font-family="Georgia, serif">A search cutoff is not the task deadline</text><text x="36" y="76" font-size="19" fill="#746d66" text-anchor="start">Same root (1, 0), same model, same search depth d = 1.</text><rect x="36" y="101" width="563" height="180" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="52" y="130" font-size="18" fill="#75566f" text-anchor="start">Searched decision</text><rect x="64" y="168" width="178" height="67" rx="8" fill="#fcfbf8" stroke="#75566f" stroke-width="1.5"/><text x="153" y="195" font-size="19" fill="#746d66" text-anchor="middle">Stage 1</text><text x="153" y="223" font-size="23" fill="#363432" text-anchor="middle" font-family="Georgia, serif">progress 0</text><rect x="399" y="168" width="178" height="67" rx="8" fill="#fcfbf8" stroke="#75566f" stroke-width="1.5"/><text x="488" y="195" font-size="19" fill="#746d66" text-anchor="middle">Stage 2</text><text x="488" y="223" font-size="23" fill="#363432" text-anchor="middle" font-family="Georgia, serif">next state</text><rect x="734" y="168" width="178" height="67" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><text x="823" y="195" font-size="19" fill="#746d66" text-anchor="middle">Stage 3</text><text x="823" y="223" font-size="23" fill="#363432" text-anchor="middle" font-family="Georgia, serif">terminal g</text><path d="M252 201 L387 201" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><text x="321" y="186" font-size="18" fill="#75566f" text-anchor="middle">decision 1</text><path d="M588 201 L722 201" fill="none" stroke="#746d66" stroke-width="2.3" stroke-dasharray="8 6" marker-end="url(#gray)"/><text x="655" y="186" font-size="18" fill="#746d66" text-anchor="middle">decision 2</text><text x="655" y="255" font-size="18" fill="#746d66" text-anchor="middle">unsearched</text><text x="488" y="266" font-size="18" fill="#75566f" text-anchor="middle">search stops here</text><text x="823" y="266" font-size="18" fill="#746d66" text-anchor="middle">real deadline</text><text x="480" y="322" font-size="24" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">W₂ estimates the return from decision 2 onward, starting at the leaf.</text><rect x="36" y="355" width="432" height="252" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><rect x="492" y="355" width="432" height="252" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><text x="252" y="394" font-size="23" fill="#75566f" text-anchor="middle">Zero cutoff values</text><text x="708" y="394" font-size="23" fill="#75566f" text-anchor="middle">Exact next-stage values</text><text x="252" y="429" font-size="24" fill="#363432" text-anchor="middle" font-family="Georgia, serif">W₂ = (0, 0, 0)</text><text x="708" y="429" font-size="24" fill="#363432" text-anchor="middle" font-family="Georgia, serif">W₂ = (0, 7, 10)</text><text x="56" y="473" font-size="20" fill="#363432" text-anchor="start">work: −1 + 0.8(0) + 0.2(0) = −1</text><text x="512" y="473" font-size="20" fill="#363432" text-anchor="start">work: −1 + 0.8(7) + 0.2(0) = 4.6</text><text x="56" y="509" font-size="20" fill="#363432" text-anchor="start">wait: W₂(0) = 0</text><text x="512" y="509" font-size="20" fill="#363432" text-anchor="start">wait: W₂(0) = 0</text><rect x="145" y="541" width="214" height="43" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="252" y="570" font-size="21" fill="#75566f" text-anchor="middle">choose wait</text><rect x="601" y="541" width="214" height="43" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="708" y="570" font-size="21" fill="#75566f" text-anchor="middle">choose work</text><text x="36" y="644" font-size="18" fill="#746d66" text-anchor="start">The state order is (0, 1, 2). One decision still remains after this search stops.</text><text x="36" y="674" font-size="18" fill="#746d66" text-anchor="start">A cutoff value stands for unsearched rewards; it is not a payment at the cutoff.</text></g></svg>
