<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 778" width="960" height="778" role="img" aria-labelledby="title desc">
<title id="title">Linear MDP structure separates successor aggregation from current feature evaluation</title><desc id="desc">The same features express the reward as phi transpose theta and each next-state probability as phi transpose mu. On the right, aggregate arbitrary successor values with model coefficients to form one vector u equal to theta plus the sum of mu of next state times V of next state. This vector does not depend on the queried current pair. On the left, compute the features of any current pair. Their dot product with u gives its Bellman target, so the same feature family represents all targets, even if V itself is not linear.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker></defs>
<rect width="960" height="778" fill="#fcfbf8"/>
<text x="36" y="40" font-size="27" fill="#363432" text-anchor="start" font-family="Georgia, serif">A linear MDP keeps every backup in the feature family</text><text x="36" y="76" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">The same known features represent the reward and transition model.</text><rect x="36" y="100" width="888" height="86" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="258" y="151" font-size="24" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">r(x, a) = φ(x, a)ᵀθ</text><text x="708" y="151" font-size="24" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">P(x′ | x, a) = φ(x, a)ᵀμ(x′)</text><text x="204" y="231" font-size="18" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">CURRENT INPUT</text><text x="684" y="231" font-size="18" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">SUCCESSOR INFORMATION</text><rect x="36" y="252" width="336" height="82" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="204" y="285" font-size="22" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">A queried pair (x, a)</text><text x="204" y="314" font-size="18" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">May vary across queries</text><rect x="444" y="252" width="480" height="82" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="684" y="285" font-size="22" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Any next-stage values V(x′)</text><text x="684" y="314" font-size="18" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">Model coefficients θ and μ(x′)</text><path d="M204 346 V387" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M684 346 V387" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="399" width="336" height="103" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="204" y="434" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Compute current features</text><text x="204" y="474" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">φ(x, a)</text><rect x="444" y="399" width="480" height="103" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="684" y="430" font-size="19" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Aggregate over all successors x′</text><text x="684" y="467" font-size="27" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">u = θ + ∑ μ(x′) V(x′)</text><text x="684" y="492" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">u is independent of the current pair</text><path d="M204 514 V553 H455 V574" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M684 514 V553 H505 V574" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="586" width="500" height="83" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="480" y="618" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Bellman target at the queried pair</text><text x="480" y="651" font-size="27" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">y(x, a) = φ(x, a)ᵀu</text><text x="36" y="713" font-size="21" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">One vector u represents the targets at all current pairs.</text><text x="36" y="747" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">This works for any V, including g; V itself need not be linear in features.</text>
</svg>
