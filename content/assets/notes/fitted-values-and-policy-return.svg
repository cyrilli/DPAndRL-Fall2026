<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc">
<title id="title">Fitted initial value, optimal return, and fitted policy return differ</title><desc id="desc">On one value axis, the fitted policy earns expected return 4.4, the optimal policy earns 4.6, and the fitted value prediction is 4.8. The policy loses 0.2 because, after the first work attempt fails with probability 0.2, it unnecessarily works in the last period and pays one more unit. The fitted number 4.8 is not an achievable expected return, and the illustrated ordering is not a general guarantee.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker></defs>
<rect width="960" height="700" fill="#fcfbf8"/>
<text x="36" y="40" font-size="27" fill="#363432" text-anchor="start" font-family="Georgia, serif">A fitted prediction is different from a policy return</text><text x="36" y="77" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">Two-stage job, starting at progress 0.</text><path d="M100 251 H872" fill="none" stroke="#746d66" stroke-width="2" marker-end="url(#arrow)"/><text x="882" y="258" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">value</text><path d="M220 244 L220 260" fill="none" stroke="#746d66" stroke-width="2"/><text x="220" y="287" font-size="26" fill="#363432" text-anchor="middle" font-family="Georgia, serif">4.4</text><path d="M480 244 L480 260" fill="none" stroke="#746d66" stroke-width="2"/><text x="480" y="287" font-size="26" fill="#363432" text-anchor="middle" font-family="Georgia, serif">4.6</text><path d="M740 244 L740 260" fill="none" stroke="#746d66" stroke-width="2"/><text x="740" y="287" font-size="26" fill="#363432" text-anchor="middle" font-family="Georgia, serif">4.8</text><text x="220" y="130" font-size="21" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">Fitted policy&#x27;s return</text><path d="M220 163 L220 235" fill="none" stroke="#746d66" stroke-width="1.5"/><text x="480" y="130" font-size="21" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Optimal return</text><path d="M480 163 L480 235" fill="none" stroke="#363432" stroke-width="1.5"/><text x="740" y="130" font-size="21" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">Fitted prediction</text><path d="M740 163 L740 235" fill="none" stroke="#75566f" stroke-width="1.5"/><circle cx="220" cy="251" r="7" fill="#746d66"/><circle cx="480" cy="251" r="7" fill="#363432"/><circle cx="740" cy="251" r="7" fill="#fcfbf8" stroke="#75566f" stroke-width="3"/><path d="M229 329 H470" fill="none" stroke="#75566f" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M471 329 H230" fill="none" stroke="#75566f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350" y="362" font-size="20" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">policy loss: 0.2</text><path d="M490 329 H730" fill="none" stroke="#75566f" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M731 329 H491" fill="none" stroke="#75566f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="610" y="362" font-size="20" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">prediction excess: 0.2</text><path d="M36 394 L924 394" fill="none" stroke="#e3ddd5" stroke-width="1.5"/><text x="36" y="432" font-size="23" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">Where does the policy lose 0.2?</text><text x="36" y="463" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">After the first attempt fails (probability 0.2), only one period remains.</text><rect x="36" y="487" width="258" height="94" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="165" y="522" font-size="18" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Progress 0, one period left</text><text x="165" y="553" font-size="18" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">Completion is impossible</text><path d="M306 534 H354 V511 H388" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M354 534 V569 H388" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="487" width="524" height="48" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><rect x="400" y="546" width="524" height="48" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="420" y="518" font-size="19" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">Optimal policy waits: no further cost</text><text x="420" y="577" font-size="19" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">Fitted policy works: pays an unnecessary 1</text><text x="36" y="635" font-size="21" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">Expected loss = 0.2 × 1 = 0.2.</text><text x="36" y="672" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">This ordering is specific to this example; 4.8 is not an achievable expected return.</text>
</svg>
