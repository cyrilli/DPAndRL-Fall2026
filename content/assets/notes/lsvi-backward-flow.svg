<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="title desc">
<title id="title">Backward LSVI uses completed next-stage values to form fixed targets</title><desc id="desc">For a two-stage problem, start at the exact terminal value V hat 3 equal to g. Build stage-2 targets, keep them fixed while fitting w2, then maximize fitted action scores to get V hat 2. Hold that completed value fixed to construct stage-1 targets, fit w1, and obtain stage-1 values and greedy actions. Each stage is processed once; arrows never return to an earlier regression.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker></defs>
<rect width="960" height="630" fill="#fcfbf8"/>
<text x="36" y="40" font-size="27" fill="#363432" text-anchor="start" font-family="Georgia, serif">LSVI works backward, one regression at a time</text><text x="36" y="76" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">Two stages: finish stage 2 before constructing stage-1 targets.</text><text x="245" y="123" font-size="18" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">STAGE 2</text><rect x="36" y="145" width="165" height="114" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="118.5" y="180" font-size="18" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Exact boundary</text><text x="118.5" y="219" font-size="28" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">V̂₃ = g</text><rect x="245" y="145" width="184" height="114" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><rect x="473" y="145" width="184" height="114" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><rect x="701" y="145" width="223" height="114" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><path d="M211 202 H233" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M439 202 H461" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M667 202 H689" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><text x="337" y="178" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Build targets</text><text x="337" y="214" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">y₂</text><text x="337" y="242" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">use fixed g</text><text x="565" y="178" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Fit weights</text><text x="565" y="214" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">w₂</text><text x="565" y="242" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">keep y₂ fixed</text><text x="812.5" y="178" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Compute scores Q̂₂</text><text x="812.5" y="214" font-size="24" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">max: V̂₂</text><text x="812.5" y="245" font-size="18" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">argmax: greedy actions</text><path d="M812 271 V321 H337 V370" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="307" font-size="18" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">hold the completed V̂₂ fixed</text><text x="245" y="359" font-size="18" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">STAGE 1</text><rect x="245" y="382" width="184" height="114" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><rect x="473" y="382" width="184" height="114" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><rect x="701" y="382" width="223" height="114" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><path d="M439 439 H461" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M667 439 H689" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><text x="337" y="415" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Build targets</text><text x="337" y="451" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">y₁</text><text x="337" y="479" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">use fixed V̂₂</text><text x="565" y="415" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Fit weights</text><text x="565" y="451" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">w₁</text><text x="565" y="479" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">keep y₁ fixed</text><text x="812.5" y="415" font-size="20" fill="#363432" text-anchor="middle" font-family="Arial, sans-serif">Compute scores Q̂₁</text><text x="812.5" y="451" font-size="24" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">max: V̂₁</text><text x="812.5" y="482" font-size="18" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">argmax: greedy actions</text><path d="M36 530 L924 530" fill="none" stroke="#e3ddd5" stroke-width="1.5"/><text x="36" y="568" font-size="20" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">During each fit: targets stay fixed; only the current weight vector changes.</text><text x="36" y="603" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">The next-stage value is an input to the regression, not its adjustable variable.</text>
</svg>
