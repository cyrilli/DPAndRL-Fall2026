<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img" aria-labelledby="title desc"><title id="title">A rollout average estimates the return of its fixed continuation policy</title><desc id="desc">Each independent run restarts at stage one progress zero, forces work, and then follows a fixed policy that works whenever unfinished. Two successes give return eight with probability0.64; all other outcomes give return minus two with probability0.36. The exact expected return is4.4. One illustrative batch of five returns8,-2,-2,8,-2 has sample mean2. More independent simulations converge to the fixed-policy value4.4, not automatically to the optimal work value4.6.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#746d66"/></marker></defs><rect width="960" height="710" fill="#fcfbf8"/><g font-family="Arial, sans-serif" fill="#363432"><text x="36" y="40" font-size="28" fill="#363432" text-anchor="start" font-family="Georgia, serif">Average independent runs of the same policy</text><text x="36" y="76" font-size="19" fill="#746d66" text-anchor="start">Restart at (1, 0); force work; then use b: work whenever unfinished.</text><text x="36" y="120" font-size="21" fill="#75566f" text-anchor="start">Return distribution under this fixed rule</text><text x="36" y="175" font-size="19" fill="#363432" text-anchor="start">Two successes</text><text x="36" y="203" font-size="22" fill="#363432" text-anchor="start" font-family="Georgia, serif">return 8</text><text x="36" y="267" font-size="19" fill="#363432" text-anchor="start">Other outcomes</text><text x="36" y="295" font-size="22" fill="#363432" text-anchor="start" font-family="Georgia, serif">return −2</text><rect x="230" y="157" width="320" height="50" rx="3" fill="#75566f"/><rect x="230" y="249" width="180" height="50" rx="3" fill="#c8b8c5"/><text x="562" y="190" font-size="20" fill="#75566f" text-anchor="start">0.64</text><text x="422" y="282" font-size="20" fill="#75566f" text-anchor="start">0.36</text><text x="230" y="330" font-size="17" fill="#746d66" text-anchor="start">Bar length = probability</text><rect x="646" y="146" width="278" height="189" rx="8" fill="#fcfbf8" stroke="#75566f" stroke-width="1.5"/><text x="785" y="182" font-size="20" fill="#75566f" text-anchor="middle">Exact expectation</text><text x="785" y="223" font-size="22" fill="#363432" text-anchor="middle" font-family="Georgia, serif">0.64(8) + 0.36(−2)</text><text x="785" y="272" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">= 4.4</text><text x="785" y="309" font-size="18" fill="#746d66" text-anchor="middle">work, then fixed b</text><path d="M36 363 H924" stroke="#e3ddd5"/><text x="36" y="402" font-size="22" fill="#75566f" text-anchor="start">Five independent runs: one possible batch</text><rect x="36" y="426" width="164" height="99" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="118" y="456" font-size="18" fill="#746d66" text-anchor="middle">run 1</text><text x="118" y="500" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">8</text><rect x="217" y="426" width="164" height="99" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><text x="299" y="456" font-size="18" fill="#746d66" text-anchor="middle">run 2</text><text x="299" y="500" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">−2</text><rect x="398" y="426" width="164" height="99" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><text x="480" y="456" font-size="18" fill="#746d66" text-anchor="middle">run 3</text><text x="480" y="500" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">−2</text><rect x="579" y="426" width="164" height="99" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="661" y="456" font-size="18" fill="#746d66" text-anchor="middle">run 4</text><text x="661" y="500" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">8</text><rect x="760" y="426" width="164" height="99" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><text x="842" y="456" font-size="18" fill="#746d66" text-anchor="middle">run 5</text><text x="842" y="500" font-size="29" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">−2</text><text x="480" y="572" font-size="26" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">Sample mean = [8 − 2 − 2 + 8 − 2] / 5 = 2</text><text x="36" y="620" font-size="19" fill="#363432" text-anchor="start">A finite batch need not equal the expectation.</text><text x="36" y="652" font-size="19" fill="#363432" text-anchor="start">As the number of independent runs grows, the mean converges to 4.4 for fixed b.</text><text x="36" y="682" font-size="18" fill="#746d66" text-anchor="start">The optimal work value is 4.6; more samples do not improve the fixed policy itself.</text></g></svg>
