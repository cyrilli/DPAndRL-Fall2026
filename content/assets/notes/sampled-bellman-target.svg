<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">A sampled Bellman target takes one of two values, while the exact target is their probability-weighted mean</title>
<desc id="desc">At stage two and progress one, work costs one. With probability 0.8 the job reaches progress two, earning terminal payoff ten and sampled target nine. With probability 0.2 it stays at progress one, earning zero terminal payoff and sampled target minus one. The exact Bellman target is 0.8 times nine plus 0.2 times minus one, equal to seven. A single transition produces nine or minus one, not seven.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker></defs>
<rect width="960" height="650" fill="#fcfbf8"/>
<g font-family="Arial, sans-serif" fill="#363432">
<text x="36" y="40" font-family="Georgia, serif" font-size="28">One sampled target; two possible outcomes</text>
<text x="36" y="77" font-size="18" fill="#746d66">Stage 2 of the job: work costs 1, then the terminal payoff is paid at stage 3.</text>
<rect x="40" y="213" width="215" height="100" rx="9" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/>
<g text-anchor="middle"><text x="147" y="249" font-size="21">progress 1</text><text x="147" y="281" font-size="21">take work</text></g>
<path d="M265 263 H321" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="340" cy="263" r="11" fill="#fcfbf8" stroke="#75566f" stroke-width="2"/>
<g fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"><path d="M349 256 L493 181"/><path d="M349 270 L493 352"/></g>
<g font-size="20" fill="#75566f"><text x="382" y="193">0.8</text><text x="382" y="343">0.2</text></g>
<g fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"><rect x="505" y="127" width="405" height="117" rx="9"/><rect x="505" y="299" width="405" height="117" rx="9"/></g>
<g font-size="19"><text x="527" y="163">next progress 2; terminal payoff 10</text><text x="527" y="335">next progress 1; terminal payoff 0</text></g>
<g font-family="Georgia, serif" font-size="26" fill="#75566f"><text x="527" y="212">sampled target: −1 + 10 = 9</text><text x="527" y="384">sampled target: −1 + 0 = −1</text></g>
<text x="36" y="462" font-size="20">The exact target averages the outcomes before fitting.</text>
<line x1="100" y1="528" x2="865" y2="528" stroke="#746d66" stroke-width="1.5"/>
<g stroke="#746d66" stroke-width="1.3"><path d="M160 522 V534"/><path d="M640 522 V534"/><path d="M760 522 V534"/></g>
<g fill="#363432"><circle cx="160" cy="528" r="6"/><circle cx="760" cy="528" r="6"/></g>
<path d="M640 518 L650 528 L640 538 L630 528 Z" fill="#fcfbf8" stroke="#75566f" stroke-width="2.5"/>
<g text-anchor="middle" font-size="20"><text x="160" y="503">sample: −1</text><text x="760" y="503">sample: 9</text><text x="640" y="565" fill="#75566f">mean: 7</text></g>
<text x="36" y="616" font-family="Georgia, serif" font-size="26">Exact target: 0.8 × 9 + 0.2 × (−1) = 7</text>
</g></svg>
