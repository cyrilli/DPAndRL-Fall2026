<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="960" height="670" role="img" aria-labelledby="title desc">
<title id="title">Uniform Bellman-fit residuals give an accumulated value-error bound</title><desc id="desc">For the job with exact terminal values, e3 is zero. Stage-2 uniform residual epsilon2 is four, so e2 is at most four. Stage-1 residual epsilon1 is 2.8, so e1 is at most 2.8 plus four, or 6.8. Bars share a scale and show upper bounds, not actual errors. Actual errors can be smaller than the displayed upper bounds.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker></defs>
<rect width="960" height="670" fill="#fcfbf8"/>
<text x="36" y="40" font-size="27" fill="#363432" text-anchor="start" font-family="Georgia, serif">Local fit residuals accumulate toward earlier stages</text><text x="36" y="76" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">Two-stage job; full-data fit; exact terminal payoff.</text><rect x="36" y="100" width="888" height="80" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><text x="56" y="132" font-size="19" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">e<tspan baseline-shift="sub" font-size="14">t</tspan>: largest absolute state-value error at stage t</text><text x="56" y="160" font-size="18" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">ε<tspan baseline-shift="sub" font-size="14">t</tspan>: largest absolute fitted-score minus Bellman-target residual, over all pairs</text><text x="36" y="227" font-size="18" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">Backward order</text><text x="300" y="227" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">Upper bound on value error (not the actual error)</text><text x="36" y="274" font-size="21" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">Stage 3: terminal</text><text x="36" y="303" font-size="19" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">e₃ = 0</text><text x="36" y="365" font-size="21" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">Stage 2</text><text x="36" y="394" font-size="19" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">e₂ ≤ 4</text><text x="36" y="456" font-size="21" fill="#363432" text-anchor="start" font-family="Arial, sans-serif">Stage 1</text><text x="36" y="485" font-size="19" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">e₁ ≤ 2.8 + 4 = 6.8</text><path d="M141 316 V334" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M141 407 V425" fill="none" stroke="#75566f" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 250 L300 483" fill="none" stroke="#e3ddd5" stroke-width="1"/><circle cx="300" cy="267" r="5" fill="#75566f"/><text x="315" y="274" font-size="20" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">0</text><rect x="300" y="339" width="320" height="42" rx="0" fill="#75566f" stroke="#75566f" stroke-width="1.5"/><text x="460" y="367" font-size="21" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">ε₂ = 4</text><text x="635" y="367" font-size="22" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">4</text><rect x="300" y="430" width="224.0" height="42" rx="0" fill="#d8cbd7" stroke="#75566f" stroke-width="1.5"/><rect x="524.0" y="430" width="320" height="42" rx="0" fill="#75566f" stroke="#75566f" stroke-width="1.5"/><text x="412.0" y="458" font-size="21" fill="#75566f" text-anchor="middle" font-family="Arial, sans-serif">ε₁ = 2.8</text><text x="684.0" y="458" font-size="21" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">ε₂ = 4</text><text x="859.0" y="458" font-size="22" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">6.8</text><path d="M300 505 L860 505" fill="none" stroke="#746d66" stroke-width="1.5"/><path d="M300 500 L300 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="300" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">0</text><path d="M380 500 L380 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="380" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">1</text><path d="M460 500 L460 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="460" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">2</text><path d="M540 500 L540 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="540" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">3</text><path d="M620 500 L620 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="620" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">4</text><path d="M700 500 L700 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="700" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">5</text><path d="M780 500 L780 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="780" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">6</text><path d="M860 500 L860 510" fill="none" stroke="#746d66" stroke-width="1"/><text x="860" y="534" font-size="17" fill="#746d66" text-anchor="middle" font-family="Arial, sans-serif">7</text><path d="M36 565 L924 565" fill="none" stroke="#e3ddd5" stroke-width="1.5"/><text x="36" y="604" font-size="21" fill="#75566f" text-anchor="start" font-family="Arial, sans-serif">Each backward step adds its own residual: e<tspan baseline-shift="sub" font-size="14">t</tspan> ≤ ε<tspan baseline-shift="sub" font-size="14">t</tspan> + e<tspan baseline-shift="sub" font-size="14">t+1</tspan>.</text><text x="36" y="643" font-size="18" fill="#746d66" text-anchor="start" font-family="Arial, sans-serif">The bars show upper bounds; the actual errors can be smaller.</text>
</svg>
