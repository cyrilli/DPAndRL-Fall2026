<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Two decisions followed by one terminal payoff, with values computed backward</title>
  <desc id="desc">For a horizon of two decisions, the real interaction moves from state X1 through X2 to terminal state X3. Action A1 earns R1, action A2 earns R2, and g of X3 is added once. Dynamic programming works in the opposite direction: initialize U3 equal to g, calculate U2 using U3, and calculate U1 using U2.</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#746d66"/></marker>
    <marker id="backward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker>
  </defs>
  <rect width="960" height="470" fill="#fcfbf8"/>
  <g font-family="Arial, sans-serif" fill="#363432">
    <text x="36" y="38" font-family="Georgia, serif" font-size="27">Two decisions, then one terminal payoff</text>
    <text x="36" y="74" font-size="18" fill="#746d66">Example horizon: H = 2</text>
    <g font-size="18" fill="#746d66" text-anchor="middle">
      <text x="160" y="119">Stage 1</text>
      <text x="480" y="119">Stage 2</text>
      <text x="800" y="119">Stage 3: terminal</text>
    </g>
    <g fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5">
      <rect x="70" y="137" width="180" height="77" rx="8"/>
      <rect x="390" y="137" width="180" height="77" rx="8"/>
      <rect x="710" y="137" width="180" height="77" rx="8"/>
    </g>
    <g font-family="Georgia, serif" font-size="29" text-anchor="middle">
      <text x="160" y="185">X₁</text>
      <text x="480" y="185">X₂</text>
      <text x="800" y="185">X₃</text>
    </g>
    <g stroke="#746d66" stroke-width="2" marker-end="url(#forward)">
      <path d="M260 175 H378"/>
      <path d="M580 175 H698"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="320" y="150">choose A₁</text>
      <text x="320" y="205">receive R₁</text>
      <text x="640" y="150">choose A₂</text>
      <text x="640" y="205">receive R₂</text>
      <text x="800" y="244" fill="#75566f">add g(X₃) once</text>
    </g>
    <line x1="36" y1="274" x2="924" y2="274" stroke="#e3ddd5"/>
    <text x="36" y="308" font-size="18" fill="#75566f">Compute values backward</text>
    <g fill="#fcfbf8" stroke="#75566f" stroke-width="1.5">
      <rect x="70" y="332" width="180" height="73" rx="8"/>
      <rect x="390" y="332" width="180" height="73" rx="8"/>
      <rect x="710" y="332" width="180" height="73" rx="8"/>
    </g>
    <g font-family="Georgia, serif" font-size="29" text-anchor="middle" fill="#75566f">
      <text x="160" y="378">U₁</text>
      <text x="480" y="378">U₂</text>
      <text x="800" y="378">U₃ = g</text>
    </g>
    <g stroke="#75566f" stroke-width="2.5" marker-end="url(#backward)">
      <path d="M378 368 H262"/>
      <path d="M698 368 H582"/>
    </g>
    <g font-size="17" text-anchor="middle" fill="#746d66">
      <text x="320" y="441">use next-stage U₂</text>
      <text x="640" y="441">use terminal g</text>
      <text x="800" y="441">initialize here</text>
    </g>
  </g>
</svg>
