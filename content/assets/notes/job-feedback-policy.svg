<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" role="img" aria-labelledby="title desc"><title id="title">Feedback chooses the second action after observing progress</title><desc id="desc">A two-period job starts at progress zero. The first work attempt costs one. With probability 0.8 progress becomes one and the policy works again; with probability 0.2 progress stays zero and the policy waits. The three terminal paths have probabilities 0.64, 0.16 and 0.20, with returns eight, minus two and minus one. Their expectation is 4.6. Fixed work twice gives 4.4 because it wastes the second cost after the first failure.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#746d66"/></marker></defs><rect width="960" height="740" fill="#fcfbf8"/><g font-family="Arial, sans-serif" fill="#363432"><text x="36" y="40" font-size="28" fill="#363432" text-anchor="start" font-family="Georgia, serif">Observe the outcome, then choose the next action</text><text x="36" y="76" font-size="18" fill="#746d66" text-anchor="start">Two work periods; each attempt costs 1 and succeeds with probability 0.8.</text><text x="125" y="122" font-size="19" fill="#746d66" text-anchor="middle">Stage 1</text><text x="420" y="122" font-size="19" fill="#746d66" text-anchor="middle">Stage 2</text><text x="790" y="122" font-size="19" fill="#746d66" text-anchor="middle">Stage 3: terminal</text><path d="M210 315 L320 240" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><path d="M210 345 L320 465" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><text x="249" y="253" font-size="20" fill="#75566f" text-anchor="middle">0.8</text><text x="249" y="445" font-size="20" fill="#75566f" text-anchor="middle">0.2</text><path d="M520 223 L660 186" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><path d="M520 246 L660 335" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><path d="M520 480 L660 493" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><text x="585" y="181" font-size="20" fill="#75566f" text-anchor="middle">0.8</text><text x="587" y="268" font-size="20" fill="#75566f" text-anchor="middle">0.2</text><text x="587" y="466" font-size="20" fill="#75566f" text-anchor="middle">1</text><rect x="40" y="280" width="170" height="95" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="125" y="318" font-size="23" fill="#363432" text-anchor="middle" font-family="Georgia, serif">progress 0</text><text x="125" y="351" font-size="21" fill="#75566f" text-anchor="middle">work: −1</text><rect x="320" y="185" width="200" height="95" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="420" y="223" font-size="23" fill="#363432" text-anchor="middle" font-family="Georgia, serif">progress 1</text><text x="420" y="256" font-size="21" fill="#75566f" text-anchor="middle">work: −1</text><rect x="320" y="430" width="200" height="95" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="420" y="468" font-size="23" fill="#363432" text-anchor="middle" font-family="Georgia, serif">progress 0</text><text x="420" y="501" font-size="21" fill="#75566f" text-anchor="middle">wait: 0</text><rect x="662" y="143" width="262" height="105" rx="8" fill="#fcfbf8" stroke="#75566f" stroke-width="1.5"/><text x="793" y="171" font-size="20" fill="#363432" text-anchor="middle">progress 2; g = 10</text><text x="793" y="203" font-size="24" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">total return 8</text><text x="793" y="232" font-size="18" fill="#746d66" text-anchor="middle">P(path) = 0.64</text><rect x="662" y="292" width="262" height="105" rx="8" fill="#fcfbf8" stroke="#75566f" stroke-width="1.5"/><text x="793" y="320" font-size="20" fill="#363432" text-anchor="middle">progress 1; g = 0</text><text x="793" y="352" font-size="24" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">total return −2</text><text x="793" y="381" font-size="18" fill="#746d66" text-anchor="middle">P(path) = 0.16</text><rect x="662" y="441" width="262" height="105" rx="8" fill="#fcfbf8" stroke="#75566f" stroke-width="1.5"/><text x="793" y="469" font-size="20" fill="#363432" text-anchor="middle">progress 0; g = 0</text><text x="793" y="501" font-size="24" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">total return −1</text><text x="793" y="530" font-size="18" fill="#746d66" text-anchor="middle">P(path) = 0.20</text><text x="36" y="586" font-size="17" fill="#746d66" text-anchor="start">Edge labels: one-step probabilities. P(path): probability of the complete path.</text><path d="M36 609 H924" stroke="#e3ddd5"/><text x="480" y="647" font-size="26" fill="#75566f" text-anchor="middle" font-family="Georgia, serif">0.64 × 8 + 0.16 × (−2) + 0.20 × (−1) = 4.6</text><text x="36" y="687" font-size="19" fill="#363432" text-anchor="start">Fixed work/work gives 4.4. Feedback saves a work cost after the first failure.</text><text x="36" y="718" font-size="19" fill="#746d66" text-anchor="start">The saving is 0.2 × 1 = 0.2 in expected return.</text></g></svg>
