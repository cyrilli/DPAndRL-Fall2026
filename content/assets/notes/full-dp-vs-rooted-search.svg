<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="960" height="670" role="img" aria-labelledby="title desc"><title id="title">Full dynamic programming shares tail problems while rooted search starts from one current state</title><desc id="desc">A schematic comparison. A full dynamic programming table contains entries for all states at each stage. A rooted search starts at the current stage-state pair and expands reachable futures. Two separate branches can reach the same later state D; the tree can duplicate its tail problem while the table has one entry. Three stage layers are shown, and tree edges summarize actions and outcomes. Rooted search need not be inexpensive.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#746d66"/></marker></defs><rect width="960" height="670" fill="#fcfbf8"/><g font-family="Arial, sans-serif" fill="#363432"><text x="36" y="40" font-size="28" fill="#363432" text-anchor="start" font-family="Georgia, serif">A complete table and a tree use computation differently</text><text x="36" y="75" font-size="18" fill="#746d66" text-anchor="start">Schematic: three stage layers are shown, with states A, B, C and D.</text><rect x="36" y="102" width="430" height="476" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><rect x="490" y="102" width="434" height="476" rx="8" fill="#fcfbf8" stroke="#e3ddd5" stroke-width="1.5"/><text x="251" y="140" font-size="24" fill="#75566f" text-anchor="middle">Full backward DP</text><text x="707" y="140" font-size="24" fill="#75566f" text-anchor="middle">Rooted search</text><text x="251" y="172" font-size="18" fill="#746d66" text-anchor="middle">compute every table entry</text><text x="707" y="172" font-size="18" fill="#746d66" text-anchor="middle">start from the current (t, A)</text><text x="155" y="218" font-size="20" fill="#746d66" text-anchor="middle">A</text><text x="235" y="218" font-size="20" fill="#746d66" text-anchor="middle">B</text><text x="315" y="218" font-size="20" fill="#746d66" text-anchor="middle">C</text><text x="395" y="218" font-size="20" fill="#746d66" text-anchor="middle">D</text><text x="91" y="273" font-size="19" fill="#746d66" text-anchor="middle">t</text><rect x="124" y="239" width="62" height="58" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="155" y="275" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="204" y="239" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="235" y="275" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="284" y="239" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="315" y="275" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="364" y="239" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="395" y="275" font-size="24" fill="#75566f" text-anchor="middle">•</text><text x="91" y="356" font-size="19" fill="#746d66" text-anchor="middle">t + 1</text><rect x="124" y="322" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="155" y="358" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="204" y="322" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="235" y="358" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="284" y="322" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="315" y="358" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="364" y="322" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="395" y="358" font-size="24" fill="#75566f" text-anchor="middle">•</text><text x="91" y="439" font-size="19" fill="#746d66" text-anchor="middle">t + 2</text><rect x="124" y="405" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="155" y="441" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="204" y="405" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="235" y="441" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="284" y="405" width="62" height="58" rx="8" fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5"/><text x="315" y="441" font-size="24" fill="#75566f" text-anchor="middle">•</text><rect x="364" y="405" width="62" height="58" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="395" y="441" font-size="24" fill="#75566f" text-anchor="middle">•</text><text x="251" y="505" font-size="19" fill="#363432" text-anchor="middle">One cell per stage and state</text><text x="251" y="537" font-size="18" fill="#746d66" text-anchor="middle">stores a value and chosen action.</text><path d="M707 258 L610 324" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><path d="M707 258 L810 324" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><path d="M610 370 L610 438" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><path d="M810 370 L810 438" fill="none" stroke="#75566f" stroke-width="2.3" marker-end="url(#arr)"/><rect x="637" y="210" width="140" height="46" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="707" y="239" font-size="20" fill="#363432" text-anchor="middle">(t, A)</text><rect x="540" y="324" width="140" height="46" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="610" y="353" font-size="20" fill="#363432" text-anchor="middle">(t + 1, B)</text><rect x="740" y="324" width="140" height="46" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="810" y="353" font-size="20" fill="#363432" text-anchor="middle">(t + 1, C)</text><rect x="540" y="438" width="140" height="46" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="610" y="467" font-size="20" fill="#363432" text-anchor="middle">(t + 2, D)</text><rect x="740" y="438" width="140" height="46" rx="8" fill="#f3eff1" stroke="#75566f" stroke-width="1.5"/><text x="810" y="467" font-size="20" fill="#363432" text-anchor="middle">(t + 2, D)</text><text x="707" y="520" font-size="19" fill="#75566f" text-anchor="middle">Same tail problem, two copies</text><text x="707" y="553" font-size="17" fill="#746d66" text-anchor="middle">Edges summarize actions + outcomes.</text><path d="M36 601 H924" stroke="#e3ddd5"/><text x="36" y="636" font-size="19" fill="#363432" text-anchor="start">Rooted search skips unrelated states, but branching and repeated tails can still be costly.</text></g></svg>
