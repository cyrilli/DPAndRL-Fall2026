<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Back up the remaining return from each stored node's own stage</title>
  <desc id="desc">A successful two-period job simulation goes from progress zero to one to two. Each work action earns minus one, and the terminal payoff is ten. The stage-two node receives return nine; the root receives return eight. Suppose both decision nodes are stored and three previous simulations succeeded on their first attempt but failed on their second. Their old mean returns are minus two at the root and minus one at stage two. Adding this successful simulation changes the counts from three to four and the means to zero point five and one point five, respectively. These are sample means, not exact expected values.</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#746d66"/></marker>
    <marker id="backward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#75566f"/></marker>
  </defs>
  <rect width="960" height="760" fill="#fcfbf8"/>
  <g font-family="Arial, sans-serif" fill="#363432">
    <text x="36" y="40" font-family="Georgia, serif" font-size="28">4. Back up the return from each node's own stage</text>
    <text x="36" y="77" font-size="18" fill="#746d66">One successful job simulation. Both decision nodes below are already stored.</text>
    <g text-anchor="middle" font-size="18" fill="#746d66">
      <text x="160" y="122">Stage 1: root</text><text x="480" y="122">Stage 2: stored node</text><text x="800" y="122">Stage 3: terminal</text>
    </g>
    <g fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5">
      <rect x="60" y="139" width="200" height="71" rx="8"/>
      <rect x="380" y="139" width="200" height="71" rx="8"/>
      <rect x="700" y="139" width="200" height="71" rx="8"/>
    </g>
    <g font-family="Georgia, serif" font-size="27" text-anchor="middle">
      <text x="160" y="183">progress 0</text><text x="480" y="183">progress 1</text><text x="800" y="183">progress 2</text>
    </g>
    <g fill="none" stroke="#746d66" stroke-width="2" marker-end="url(#forward)">
      <path d="M270 175 H368"/><path d="M590 175 H688"/>
    </g>
    <g text-anchor="middle" font-size="18">
      <text x="320" y="151">work</text><text x="320" y="206">reward −1</text>
      <text x="640" y="151">work</text><text x="640" y="206">reward −1</text>
      <text x="800" y="240" fill="#75566f">terminal payoff 10, once</text>
    </g>
    <line x1="36" y1="270" x2="924" y2="270" stroke="#e3ddd5"/>
    <text x="36" y="307" font-size="20" fill="#75566f">Compute the remaining returns backward</text>
    <g fill="#fcfbf8" stroke="#75566f" stroke-width="1.5">
      <rect x="60" y="330" width="200" height="75" rx="8"/>
      <rect x="380" y="330" width="200" height="75" rx="8"/>
      <rect x="700" y="330" width="200" height="75" rx="8"/>
    </g>
    <g font-family="Georgia, serif" font-size="26" text-anchor="middle" fill="#75566f">
      <text x="160" y="375">Y₁ = −1 + 9 = 8</text><text x="480" y="375">Y₂ = −1 + 10 = 9</text><text x="800" y="375">Y₃ = 10</text>
    </g>
    <g fill="none" stroke="#75566f" stroke-width="2.5" marker-end="url(#backward)">
      <path d="M368 366 H272"/><path d="M688 366 H592"/>
    </g>
    <g font-size="17" text-anchor="middle" fill="#746d66">
      <text x="320" y="430">add stage-1 reward</text><text x="640" y="430">add stage-2 reward</text>
    </g>
    <line x1="36" y1="459" x2="924" y2="459" stroke="#e3ddd5"/>
    <text x="36" y="497" font-size="20" fill="#75566f">Update only the visited tree edges, using their own returns</text>
    <text x="36" y="527" font-size="17" fill="#746d66">Example: three earlier simulations succeeded first, then failed on the second attempt.</text>
    <g fill="#f3eff1" stroke="#e3ddd5" stroke-width="1.5">
      <rect x="36" y="549" width="432" height="147" rx="8"/>
      <rect x="492" y="549" width="432" height="147" rx="8"/>
    </g>
    <g font-size="20">
      <text x="56" y="583">Root, work: add return 8</text>
      <text x="512" y="583">Stage 2, work: add return 9</text>
    </g>
    <g font-size="18" fill="#746d66">
      <text x="56" y="619">visits: 3 → 4</text><text x="512" y="619">visits: 3 → 4</text>
    </g>
    <g font-family="Georgia, serif" font-size="23" fill="#75566f">
      <text x="56" y="661">mean: −2 + (8 − (−2)) / 4 = 0.5</text>
      <text x="512" y="661">mean: −1 + (9 − (−1)) / 4 = 1.5</text>
    </g>
    <text x="36" y="736" font-size="18" fill="#746d66">The two nodes receive different returns. These averages are not exact DP values.</text>
  </g>
</svg>
